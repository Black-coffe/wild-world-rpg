name: Deploy

on:
  push:
    branches: [develop]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: PHPUnit
    runs-on: ubuntu-latest
    # Норма ~6 мин. Потолок, чтобы медленный раннер или зависший тест не держал очередь деплоев
    # (concurrency без cancel) дефолтные 360 мин.
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: wildworld_tests
        ports:
          - 3306:3306
        # Тест-БД одноразовая: данные в RAM, без fsync (см. «Fast MySQL» ниже). 2026-09-27 раннер с
        # медленным диском растянул набор с ~6 до ~40 мин — DB-тесты упираются в IO.
        options: >-
          --tmpfs /var/lib/mysql:rw
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      # Тег ставится на коммит, уже прошедший develop → preprod-смоук. Если PHPUnit на этом SHA уже
      # зелёный в develop-прогоне, второй раз набор не гоняем — тег сразу идёт к деплою.
      - name: Reuse develop test result for tag
        id: reuse
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ok=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}&branch=develop&event=push&per_page=20" \
                 --jq '.workflow_runs[].id' | while read -r id; do
                 gh api "repos/${{ github.repository }}/actions/runs/$id/jobs" \
                   --jq '.jobs[] | select(.name=="PHPUnit" and .conclusion=="success") | .id'
               done | head -1)
          if [ -n "$ok" ]; then
            echo "PHPUnit уже зелёный на ${{ github.sha }} (develop job $ok) — пропускаю повторный прогон"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.reuse.outputs.skip != 'true'

      - name: Setup PHP
        if: steps.reuse.outputs.skip != 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, mysqli, curl, gd
          coverage: none

      - name: Cache composer
        if: steps.reuse.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-

      - name: Composer install
        if: steps.reuse.outputs.skip != 'true'
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Wait for MySQL
        if: steps.reuse.outputs.skip != 'true'
        run: |
          for i in {1..30}; do
            mysql -h 127.0.0.1 -uroot -e "SELECT 1" wildworld_tests && break
            echo "MySQL not ready, waiting…"
            sleep 2
          done

      # Fast MySQL: сервис-контейнеру нельзя передать аргументы mysqld, но эти переменные динамические.
      - name: Fast MySQL (no fsync)
        if: steps.reuse.outputs.skip != 'true'
        run: mysql -h 127.0.0.1 -uroot -e "SET GLOBAL innodb_flush_log_at_trx_commit=0; SET GLOBAL sync_binlog=0;"

      # F1.3: PHPStan static analysis (level 5, baseline для legacy).
      # Любая новая ошибка типа в новом коде блочит deploy. Baseline
      # обновляется отдельным коммитом с ясным intention.
      - name: Run PHPStan
        if: steps.reuse.outputs.skip != 'true'
        run: composer phpstan

      - name: Run PHPUnit
        if: steps.reuse.outputs.skip != 'true'
        run: vendor/bin/phpunit --no-coverage

  deploy:
    name: Deploy ${{ github.ref_type == 'tag' && 'production' || 'preprod' }}
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_type == 'tag' && 'production' || 'preprod' }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute deploy target
        id: target
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "user=${{ secrets.PROD_USER }}" >> "$GITHUB_OUTPUT"
            echo "domain=bot.wildworld.fun" >> "$GITHUB_OUTPUT"
            echo "bot_token=${{ secrets.PROD_BOT_TOKEN }}" >> "$GITHUB_OUTPUT"
          else
            echo "user=${{ secrets.PREPROD_USER }}" >> "$GITHUB_OUTPUT"
            echo "domain=testbot.wildworld.fun" >> "$GITHUB_OUTPUT"
            echo "bot_token=${{ secrets.PREPROD_BOT_TOKEN }}" >> "$GITHUB_OUTPUT"
          fi
          echo "ts=$(date -u +%Y-%m-%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust SSH host
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Stamp release SHA
        run: echo "${{ github.sha }}" > .release-sha

      - name: Rsync release
        env:
          USER: ${{ steps.target.outputs.user }}
          HOST: ${{ secrets.SSH_HOST }}
          TS: ${{ steps.target.outputs.ts }}
        run: |
          ssh "$USER@$HOST" "mkdir -p ~/releases/$TS"
          rsync -az --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='vendor' \
            --exclude='writable' \
            --exclude='node_modules' \
            --exclude='tests/_output' \
            --exclude='build' \
            --exclude='.claude' \
            --exclude='memory' \
            --exclude='templates' \
            --exclude='bootstrap' \
            --exclude='scripts' \
            --exclude='CLAUDE.vulyk.md' \
            ./ "$USER@$HOST:~/releases/$TS/"

      - name: Run post-deploy
        id: postdeploy
        env:
          USER: ${{ steps.target.outputs.user }}
          HOST: ${{ secrets.SSH_HOST }}
          DOMAIN: ${{ steps.target.outputs.domain }}
          TS: ${{ steps.target.outputs.ts }}
        run: |
          ssh "$USER@$HOST" "bash ~/releases/$TS/deploy/post-deploy.sh '$DOMAIN' '$TS'"

      - name: Smoke test (Telegram getMe)
        id: smoke
        env:
          BOT_TOKEN: ${{ steps.target.outputs.bot_token }}
        run: |
          response=$(curl -fsS --max-time 10 "https://api.telegram.org/bot${BOT_TOKEN}/getMe")
          echo "$response"
          echo "$response" | grep -q '"ok":true'

      - name: Auto-rollback on smoke failure
        if: failure() && steps.smoke.outcome == 'failure' && steps.postdeploy.outcome == 'success'
        env:
          USER: ${{ steps.target.outputs.user }}
          HOST: ${{ secrets.SSH_HOST }}
          DOMAIN: ${{ steps.target.outputs.domain }}
        run: |
          ssh "$USER@$HOST" "bash ~/htdocs/$DOMAIN/deploy/rollback.sh '$DOMAIN'"

  # ADR-052 — публичный сайт wildworld.fun. Отдельная CloudPanel-площадка (user=wildworld),
  # та же кодовая база и ОБЩАЯ игровая БД с ботом (wiki берётся из живых таблиц).
  # Катится только на прод-тегах и ТОЛЬКО ПОСЛЕ деплоя бота (needs: deploy), чтобы:
  #   1) миграции/контент уже применены ботом к общей БД (здесь SKIP_DB=1 — без гонки);
  #   2) сайт не поднялся на новом коде против старой схемы.
  # link-mode=public: nginx root = htdocs/wildworld.fun → симлинк на release/public.
  deploy-website:
    name: Deploy public site (wildworld.fun)
    needs: deploy
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust SSH host
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Stamp release SHA
        run: echo "${{ github.sha }}" > .release-sha

      - name: Compute TS
        id: ts
        run: echo "ts=$(date -u +%Y-%m-%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Rsync release
        env:
          USER: wildworld
          HOST: ${{ secrets.SSH_HOST }}
          TS: ${{ steps.ts.outputs.ts }}
        run: |
          ssh "$USER@$HOST" "mkdir -p ~/releases/$TS"
          rsync -az --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='vendor' \
            --exclude='writable' \
            --exclude='node_modules' \
            --exclude='tests/_output' \
            --exclude='build' \
            --exclude='.claude' \
            --exclude='memory' \
            --exclude='templates' \
            --exclude='bootstrap' \
            --exclude='scripts' \
            --exclude='CLAUDE.vulyk.md' \
            ./ "$USER@$HOST:~/releases/$TS/"

      - name: Run post-deploy (public-rooted, shared DB)
        id: postdeploy
        env:
          USER: wildworld
          HOST: ${{ secrets.SSH_HOST }}
          TS: ${{ steps.ts.outputs.ts }}
        run: |
          ssh "$USER@$HOST" "bash ~/releases/$TS/deploy/post-deploy.sh 'wildworld.fun' '$TS' public 1"

      - name: Smoke test (HTTP)
        id: smoke
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 https://wildworld.fun/)
          echo "home HTTP $code"
          [ "$code" = "200" ]

      - name: Auto-rollback on smoke failure
        if: failure() && steps.smoke.outcome == 'failure' && steps.postdeploy.outcome == 'success'
        env:
          USER: wildworld
          HOST: ${{ secrets.SSH_HOST }}
        run: |
          ssh "$USER@$HOST" 'PREV=$(ls -1dt ~/releases/*/ | sed -n 2p | sed "s:/$::"); if [ -n "$PREV" ] && [ -d "$PREV/public" ]; then ln -sfn "$PREV/public" ~/htdocs/wildworld.fun.tmp && mv -Tf ~/htdocs/wildworld.fun.tmp ~/htdocs/wildworld.fun && echo "rolled back to $PREV"; else echo "no previous release to roll back to"; fi'
