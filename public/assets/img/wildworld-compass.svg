<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Wild World">
  <title>Wild World</title>
  <!-- тёмная плитка: знак читается на любом фоне -->
  <rect x="2" y="2" width="60" height="60" rx="13" fill="#1A1714"/>
  <!-- тонкое кольцо компаса -->
  <circle cx="32" cy="32" r="25.5" fill="none" stroke="#E89B2E" stroke-opacity="0.30" stroke-width="1.3"/>
  <!-- 4-конечная роза, фасетки: amber (по часовой) + cream -->
  <g>
    <polygon points="32,32 32,6 24,24"  fill="#EBDFC6"/>
    <polygon points="32,32 32,6 40,24"  fill="#E89B2E"/>
    <polygon points="32,32 58,32 40,24" fill="#EBDFC6"/>
    <polygon points="32,32 58,32 40,40" fill="#E89B2E"/>
    <polygon points="32,32 32,58 40,40" fill="#EBDFC6"/>
    <polygon points="32,32 32,58 24,40" fill="#E89B2E"/>
    <polygon points="32,32 6,32 24,40"  fill="#EBDFC6"/>
    <polygon points="32,32 6,32 24,24"  fill="#E89B2E"/>
  </g>
  <!-- ступица -->
  <circle cx="32" cy="32" r="5.4" fill="#1A1714"/>
  <circle cx="32" cy="32" r="3.9" fill="#E89B2E"/>
  <circle cx="32" cy="32" r="1.5" fill="#1A1714"/>
</svg>
